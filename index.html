</head>

<body>

    </div>

  <section class="hero">

      <h1
        data-en="Record what you actually did"
        data-zh="记录你真正做过的事"></h1>

      <p class="lead"
         data-en="DoneLog helps you track completed tasks, visualize your time, and generate CSV/PDF reports for review."

      </div>

      <div style="margin-top:24px;color:var(--text2)">
        <span>• </span>
        <span
          data-en="Activity logging · Timeline · Insights · Categories · Reminders · CSV/PDF Export"
          data-zh="活动记录 · 时间轴 · 洞察分析 · 分类管理 · 提醒通知 · CSV/PDF 导出"></span>
      </div>
    </div>

    <div>

      <div class="pn-card">
        <div class="pn-top" data-en="DoneLog · Timeline" data-zh="DoneLog · 时间轴"></div>
        <div class="pn-body">
          <div class="pn-row">
            <div class="pn-avatar"></div>
            <div class="pn-line bold"></div>
          </div>

          <div class="pn-row">
            <span class="pn-chip">
              <span data-en="Activity logging" data-zh="活动记录"></span>
            </span>
            <span class="pn-chip">
              <span data-en="Timeline view" data-zh="时间轴视图"></span>
            </span>
          </div>

          <div class="pn-row">
            <div class="pn-line" style="width:92%"></div>
          </div>

          <div class="pn-row">
            <span class="pn-chip">
              <span data-en="Insights & Analytics" data-zh="洞察分析"></span>
            </span>
            <span class="pn-chip">
              <span data-en="Category management" data-zh="分类管理"></span>
              <span class="pn-dots"><span class="pn-dot"></span><span class="pn-dot"></span></span>
            </span>
          </div>

          <div class="pn-row">
            <span class="pn-chip">
              <span data-en="Reminders & Notifications" data-zh="提醒与通知"></span>
            </span>
            <span class="pn-chip">
              <span data-en="CSV / PDF Export" data-zh="CSV / PDF 导出"></span>
            </span>
          </div>
        </div>

        <div class="pn-bar"
             data-en="Add → Record → Review"
             data-zh="添加 → 记录 → 回顾"></div>
      </div>
    </div>
  </section>

  <section id="features" class="section">
    <h2 data-en="Key features" data-zh="核心功能"></h2>
    <div class="grid-3" style="margin-top:24px">

      <!-- 核心功能示例卡 -->
      <div class="card">
        <div class="tag" data-en="Logging" data-zh="记录"></div>
        <h3 style="margin:12px 0"
            data-en="Activity logging"
            data-zh="活动记录"></h3>
        <p class="text2"
           data-en="Record completed tasks with title, notes, start and end time, and milestones."
           data-zh="记录完成任务，包括标题、备注、开始/结束时间，以及里程碑标记。"></p>
      </div>

      <div class="card">
        <div class="tag" data-en="Timeline" data-zh="时间轴"></div>
        <h3 style="margin:12px 0"
            data-en="Timeline View"
            data-zh="时间轴视图"></h3>
        <p class="text2"
           data-en="Review your day in chronological order and visualize your time blocks."
           data-zh="按时间顺序回顾每天的活动轨迹，清晰了解时间分配。"></p>
      </div>

      <div class="card">
        <div class="tag" data-en="Insights" data-zh="洞察"></div>
        <h3 style="margin:12px 0"
            data-en="Insights & Analytics"
            data-zh="洞察分析"></h3>
        <p class="text2"

    <div class="gallery" style="margin-top:16px">
      <img class="landscape" src="ss_en_1.png" data-en-src="ss_en_1.png" data-zh-src="ss_zh_1.png" alt="DoneLog screenshot 1">
      <img class="landscape" src="ss_en_2.png" data-en-src="ss_en_2.png" data-zh-src="ss_zh_2.png" alt="DoneLog screenshot 2">
      <img class="landscape" src="ss_en_3.png" data-en-src="ss_en_3.png" data-zh-src="ss_zh_3.png" alt="DoneLog screenshot 3">
      <img class="landscape" src="ss_en_4.png" data-en-src="ss_en_4.png" data-zh-src="ss_zh_4.png" alt="DoneLog screenshot 4">
    </div>
  </section>

  <section class="section">
    <div class="grid-2">
      <div class="card">
        <h2 id="privacy" data-en="Privacy" data-zh="隐私"></h2>
        <p class="text2"
           data-en="DoneLog is designed with privacy in mind."
           data-zh="DoneLog 以隐私优先为设计原则。"></p>
        <ul style="margin:12px 0 0 18px; color: var(--text2); line-height:1.7">
          <li data-en="No account required. Start logging right away."
              data-zh="无需注册账号，即可开始记录活动。"></li>
          <li data-en="Your logs are stored locally and under your control."
              data-zh="所有记录均保存在本地，由你完全掌控。"></li>
          <li data-en="Export CSV or PDF reports as needed."
              data-zh="可根据需要导出 CSV 或 PDF 报告。"></li>
          <li data-en="Local notifications help you track tasks timely."
              data-zh="本地通知提醒帮助你及时记录任务。"></li>
        </ul>
      </div>

      <div class="card">
        <h2 id="support" data-en="Support" data-zh="支持"></h2>
        <p class="text2"
           data-en="Questions or feedback about DoneLog? Email us."
           data-zh="关于 DoneLog 的问题或建议，欢迎邮件联系。"></p>
        <p><a href="mailto:freesysck@outlook.com">freesysck@outlook.com</a></p>
        <p>
          <a href="#" target="_blank" rel="noopener" data-en="Marketing site" data-zh="营销网站"></a><br>
          <a href="#" target="_blank" rel="noopener" data-en="Privacy policy" data-zh="隐私政策"></a>
        </p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="grid-2">
      <div>
        <strong>
          <span data-en="DoneLog" data-zh="DoneLog"></span> ·
          <span data-en="Done List & Time Log" data-zh="完成日志与时间记录"></span>
        </strong><br>
        <span
          data-en="© 2026 DoneLog. All rights reserved."
          data-zh="© 2026 DoneLog。保留所有权利。"></span>
      </div>
    </div>
  </footer>
</div>

<script>
/* 保留语言切换功能不变 */
function swapLangImages(lang){
  document.querySelectorAll("img[data-en-src]").forEach(img=>{
    const src = img.getAttribute(lang==="zh" ? "data-zh-src" : "data-en-src");
    if(src) img.setAttribute("src", src);
  });
}
function setLang(lang){
  document.querySelectorAll("[data-en]").forEach(el=>{
    const text = el.getAttribute(lang === "zh" ? "data-zh" : "data-en");
    if(text!==null){ el.textContent = text; }
  });
  const titleEl = document.getElementById("title-el");
  if(titleEl){
    const t = titleEl.getAttribute(lang === "zh" ? "data-zh" : "data-en");
    if(t) document.title = t;
  }
  const metaDesc = document.getElementById("meta-desc");
  if(metaDesc){
    const d = metaDesc.getAttribute(lang === "zh" ? "data-zh" : "data-en");
    if(d) metaDesc.setAttribute("content", d);
  }
  swapLangImages(lang);
  document.getElementById("btn-en").classList.toggle("active", lang==="en");
  document.getElementById("btn-zh").classList.toggle("active", lang==="zh");
  localStorage.setItem("DoneLog-lang", lang);
}
document.getElementById("btn-en").onclick=()=>setLang("en");
document.getElementById("btn-zh").onclick=()=>setLang("zh");
const saved = localStorage.getItem("DoneLog-lang") || (navigator.language.startsWith("zh")?"zh":"en");
setLang(saved);
</script>

</body>
</html>
